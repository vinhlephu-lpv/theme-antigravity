<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 58" fill="none">
  <defs>
    <linearGradient id="mxCore" x1="40" y1="8" x2="80" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="40%" stop-color="#34d399"/>
      <stop offset="80%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064e3b"/>
    </linearGradient>
    <linearGradient id="mxTrace" x1="8" y1="30" x2="112" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0"/>
      <stop offset="28%" stop-color="#34d399" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#67e8f9" stop-opacity="1"/>
      <stop offset="72%" stop-color="#34d399" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </linearGradient>
    <filter id="mxGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Circuit data wings -->
  <polyline points="8,35 24,35 30,29 38,29" stroke="url(#mxTrace)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="112,35 96,35 90,29 82,29" stroke="url(#mxTrace)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
  <polyline points="18,41 32,41 37,36" stroke="#67e8f9" stroke-opacity="0.55" stroke-width="0.9" stroke-linecap="round"/>
  <polyline points="102,41 88,41 83,36" stroke="#67e8f9" stroke-opacity="0.55" stroke-width="0.9" stroke-linecap="round"/>
  <!-- Outer tactical hex bracket -->
  <polygon points="60,4 82,16.5 82,41.5 60,54 38,41.5 38,16.5" stroke="#10b981" stroke-width="1.5" stroke-dasharray="18 7" filter="url(#mxGlow)"/>
  <!-- Inner solid quantum reactor hexagon -->
  <g filter="url(#mxGlow)">
    <polygon points="60,11 75.5,20 75.5,38 60,47 44.5,38 44.5,20" fill="#041514" stroke="#67e8f9" stroke-width="1.2"/>
    <polygon points="60,17 70.5,23 70.5,35 60,41 49.5,35 49.5,23" fill="url(#mxCore)" fill-opacity="0.88" stroke="#a7f3d0" stroke-width="0.9"/>
    <circle cx="60" cy="29" r="3.6" fill="#ffffff"/>
  </g>
  <!-- Tactical node squares -->
  <rect x="20" y="21" width="3.5" height="3.5" transform="rotate(45 21.7 22.7)" fill="#34d399" filter="url(#mxGlow)"/>
  <rect x="96" y="20" width="3.5" height="3.5" transform="rotate(45 97.7 21.7)" fill="#67e8f9" filter="url(#mxGlow)"/>
  <circle cx="8" cy="35" r="1.8" fill="#34d399"/>
  <circle cx="112" cy="35" r="1.8" fill="#67e8f9"/>
</svg>
