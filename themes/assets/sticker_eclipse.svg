<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 116 58" fill="none">
  <defs>
    <radialGradient id="ecCorona" cx="50%" cy="50%" r="50%">
      <stop offset="48%" stop-color="#0b0609"/>
      <stop offset="62%" stop-color="#f59e0b" stop-opacity="0.95"/>
      <stop offset="78%" stop-color="#fb7185" stop-opacity="0.62"/>
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ecGold" x1="10" y1="29" x2="106" y2="29" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fb7185" stop-opacity="0"/>
      <stop offset="30%" stop-color="#f59e0b" stop-opacity="0.88"/>
      <stop offset="50%" stop-color="#fef08a" stop-opacity="1"/>
      <stop offset="70%" stop-color="#fb7185" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#fb7185" stop-opacity="0"/>
    </linearGradient>
    <filter id="ecGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.0" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Astrolabe horizon wings -->
  <path d="M6 34 Q28 29, 39 33 M110 34 Q88 29, 77 33" stroke="url(#ecGold)" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Tilted armillary orbit ring -->
  <ellipse cx="58" cy="29" rx="44" ry="12" transform="rotate(-14 58 29)" stroke="#f59e0b" stroke-opacity="0.72" stroke-width="1.15"/>
  <ellipse cx="58" cy="29" rx="34" ry="9.5" transform="rotate(16 58 29)" stroke="#fb7185" stroke-opacity="0.65" stroke-width="1"/>
  <!-- Outer clock dial ring -->
  <circle cx="58" cy="29" r="22" stroke="#f59e0b" stroke-width="1.3" stroke-opacity="0.85"/>
  <circle cx="58" cy="29" r="19.5" stroke="#fde68a" stroke-width="1.2" stroke-dasharray="1.8 4.2" stroke-opacity="0.82"/>
  <!-- Solar Eclipse Corona + Obsidian Moon -->
  <circle cx="58" cy="29" r="17.5" fill="url(#ecCorona)" filter="url(#ecGlow)"/>
  <circle cx="58" cy="29" r="9.4" fill="#090507" stroke="#fde68a" stroke-width="1.2"/>
  <!-- Golden crescent flare on eclipse rim -->
  <path d="M51 23 A9.5 9.5 0 0 1 65 23" stroke="#fffbeb" stroke-width="1.6" stroke-linecap="round" filter="url(#ecGlow)"/>
  <!-- Cardinal sun rays -->
  <polygon points="58,2 60,7 58,10 56,7" fill="#fde68a"/>
  <polygon points="58,48 60,51 58,56 56,51" fill="#f59e0b"/>
  <!-- Orbiting mini moon & ember -->
  <circle cx="20" cy="36" r="2.2" fill="#fde68a" filter="url(#ecGlow)"/>
  <circle cx="96" cy="21" r="2.1" fill="#fb7185" filter="url(#ecGlow)"/>
</svg>
