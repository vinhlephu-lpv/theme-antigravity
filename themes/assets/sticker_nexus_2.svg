<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 56" fill="none">
  <defs>
    <linearGradient id="crBody" x1="48" y1="8" x2="72" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ecfeff"/>
      <stop offset="35%" stop-color="#5eead4"/>
      <stop offset="75%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#115e59"/>
    </linearGradient>
    <linearGradient id="crFacet" x1="55" y1="12" x2="66" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#99f6e4" stop-opacity="0.25"/>
    </linearGradient>
    <linearGradient id="crStream" x1="60" y1="2" x2="60" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0"/>
      <stop offset="50%" stop-color="#99f6e4" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </linearGradient>
    <filter id="crGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.1" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Vertical emerald-cyan soul stream -->
  <path d="M60 2 C57 14, 63 22, 60 30 C57 38, 63 46, 60 54" stroke="url(#crStream)" stroke-width="2.6" stroke-linecap="round" filter="url(#crGlow)"/>
  <!-- Crossed orbital halos -->
  <ellipse cx="60" cy="30" rx="45" ry="12.5" transform="rotate(-11 60 30)" stroke="#fef08a" stroke-opacity="0.72" stroke-width="1.15"/>
  <ellipse cx="60" cy="30" rx="37" ry="10.5" transform="rotate(13 60 30)" stroke="#2dd4bf" stroke-opacity="0.82" stroke-width="1.15"/>
  <!-- Levitating faceted soul crystal -->
  <g filter="url(#crGlow)">
    <polygon points="60,9 71,21 68,40 60,48 51,39 49,22" fill="url(#crBody)" stroke="#ccfbf1" stroke-width="0.9"/>
    <polygon points="60,9 71,21 60,29 53,20" fill="url(#crFacet)"/>
    <polygon points="60,29 71,21 68,40 60,48" fill="#14b8a6" fill-opacity="0.55"/>
    <polygon points="60,9 53,20 49,22 51,39 60,29" fill="#99f6e4" fill-opacity="0.45"/>
    <line x1="60" y1="9" x2="60" y2="48" stroke="#ffffff" stroke-opacity="0.7" stroke-width="0.8"/>
    <line x1="49" y1="22" x2="71" y2="21" stroke="#ecfeff" stroke-opacity="0.5" stroke-width="0.6"/>
  </g>
  <!-- Orbiting emerald & gold motes -->
  <circle cx="22" cy="35" r="2.4" fill="#fef08a" filter="url(#crGlow)"/>
  <circle cx="96" cy="22" r="2.3" fill="#5eead4" filter="url(#crGlow)"/>
  <circle cx="85" cy="39" r="1.7" fill="#fde68a"/>
  <path d="M105 33 L106 36 L109 37 L106 38 L105 41 L104 38 L101 37 L104 36 Z" fill="#5eead4"/>
  <path d="M16 17 L17 19.6 L19.6 20.6 L17 21.6 L16 24.2 L15 21.6 L12.4 20.6 L15 19.6 Z" fill="#fef08a"/>
</svg>
