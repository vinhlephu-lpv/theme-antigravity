<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 116 58" fill="none">
  <defs>
    <linearGradient id="slRing" x1="16" y1="8" x2="100" y2="50" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38e8ff"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="slCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#7ef9ff"/>
      <stop offset="72%" stop-color="#a78bfa" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#38e8ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="slGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Horizontal HUD energy wings -->
  <path d="M6 34 L34 34 M82 34 L110 34" stroke="url(#slRing)" stroke-width="1.3" stroke-linecap="round" opacity="0.85"/>
  <path d="M16 39 L36 37 M100 39 L80 37" stroke="#fbbf24" stroke-width="0.9" stroke-opacity="0.55" stroke-linecap="round"/>
  <!-- Outer golden rune ring -->
  <circle cx="58" cy="29" r="23" stroke="url(#slRing)" stroke-width="1.6" filter="url(#slGlow)"/>
  <circle cx="58" cy="29" r="20.2" stroke="#fbbf24" stroke-width="1.1" stroke-dasharray="2.5 3.5" stroke-opacity="0.85"/>
  <!-- Sacred hexagon & inverted triangle -->
  <polygon points="58,10 74.5,19.5 74.5,38.5 58,48 41.5,38.5 41.5,19.5" stroke="#38e8ff" stroke-opacity="0.72" stroke-width="1"/>
  <polygon points="58,14 71,36.5 45,36.5" stroke="#fbbf24" stroke-opacity="0.65" stroke-width="0.9"/>
  <polygon points="58,44 45,21.5 71,21.5" stroke="#a78bfa" stroke-opacity="0.65" stroke-width="0.9"/>
  <!-- Luminous core -->
  <circle cx="58" cy="29" r="10.5" fill="url(#slCore)" filter="url(#slGlow)"/>
  <circle cx="58" cy="29" r="3.4" fill="#ffffff"/>
  <!-- 4 cardinal star diamonds -->
  <polygon points="58,2 60.4,5.8 58,9.5 55.6,5.8" fill="#fbbf24"/>
  <polygon points="58,48.5 60.4,52.2 58,56 55.6,52.2" fill="#fbbf24"/>
  <polygon points="31,29 34.8,26.6 38.5,29 34.8,31.4" fill="#38e8ff"/>
  <polygon points="85,29 81.2,26.6 77.5,29 81.2,31.4" fill="#a78bfa"/>
  <!-- Orbit sparks -->
  <circle cx="22" cy="24" r="1.6" fill="#38e8ff" filter="url(#slGlow)"/>
  <circle cx="94" cy="23" r="1.6" fill="#fbbf24" filter="url(#slGlow)"/>
</svg>
